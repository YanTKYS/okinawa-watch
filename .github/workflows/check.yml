name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --test tests/display.test.cjs
      - name: Live feed smoke check (no publication, no credentials)
        run: python scripts/watch.py collect --data work/live-articles.json --report work/live-report.json
      - run: python scripts/source_report.py --baseline-publisher '号外NET'
      - name: Inspect accepted metadata
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          data = json.loads(Path('work/live-articles.json').read_text())
          print('COLLECTED_DATA_JSON=' + json.dumps(data, ensure_ascii=False))
          PYTHON
      - run: python scripts/watch.py build --data work/live-articles.json --report work/live-report.json
      - run: node scripts/display-report.cjs work/live-articles.json > work/display-report.json
      - run: python scripts/watch.py build --sample --output work/sample-site
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: |
            work/site
            work/sample-site
            work/live-report.json
            work/display-report.json
            work/source-comparison.json
          retention-days: 14
