name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - name: Live feed smoke check (no publication, no credentials)
        run: python scripts/watch.py collect --data work/live-articles.json --report work/live-report.json
      - run: python scripts/watch.py build --data work/live-articles.json --report work/live-report.json
      - run: python scripts/watch.py build --sample --output work/sample-site
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: |
            work/site
            work/sample-site
            work/live-report.json
          retention-days: 14
