name: Collect and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '23 0,12 * * *' # 09:23 / 21:23 JST, twice daily
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'web/**'
      - 'config/**'
      - '.github/workflows/collect.yml'
permissions:
  contents: read
concurrency:
  group: collect-pages
  cancel-in-progress: false
jobs:
  collect:
    # Deploy only reviewed default-branch code, including manual dispatches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Restore collected metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git ls-remote --heads origin collected-data > "$RUNNER_TEMP/data-ref"
          if test -s "$RUNNER_TEMP/data-ref"; then
            git fetch origin refs/heads/collected-data
            git show FETCH_HEAD:articles.json > data/articles.json
          fi
      - name: Collect metadata (individual failures are logged)
        run: python scripts/watch.py collect
      - name: Save audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-audit-${{ github.run_id }}
          path: work/collection-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Add collection summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('work/collection-report.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## 収集結果\n\n```json\n' + json.dumps({k:v for k,v in report.items() if k != 'exclusions'}, ensure_ascii=False, indent=2) + '\n```\n')
          PY
      - name: Persist metadata on a separate branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -s "$RUNNER_TEMP/data-ref"; then
            git worktree add --detach "$RUNNER_TEMP/okinawa-data" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/okinawa-data" HEAD
            git -C "$RUNNER_TEMP/okinawa-data" checkout --orphan collected-data
            git -C "$RUNNER_TEMP/okinawa-data" rm -rf .
          fi
          cp data/articles.json "$RUNNER_TEMP/okinawa-data/articles.json"
          git -C "$RUNNER_TEMP/okinawa-data" add articles.json
          if ! git -C "$RUNNER_TEMP/okinawa-data" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/okinawa-data" commit -m 'Update collected metadata'
            git -C "$RUNNER_TEMP/okinawa-data" push origin HEAD:refs/heads/collected-data
          fi
      - run: python scripts/watch.py build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
